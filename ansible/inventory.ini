# Hosts are reached by IP, not by the ~/.ssh/config aliases (pve,
# control-node, worker-node): roles/k3s_node writes ansible_host into k3s's
# node-ip, so it has to be the address. The key is the one those aliases
# use, p1, served by the 1Password agent; the file named below is only its
# public half, which tells ssh which agent key to offer.
#
# 300 control: 2 vCPU, 4GiB RAM  — control plane only, no Longhorn replicas
# 301 worker1: 8 vCPU, 13GiB RAM — every workload, plus vdb for Longhorn
# Why the RAM is split that way: docs/reference/architecture.md.

# Only upgrade.yml targets the host. site.yml stays on the VMs, and the host's
# configuration is still by hand (see README.md).
[proxmox_hosts]
pve ansible_host=192.168.1.2 wireguard_ctid=101

[k3s_servers]
k3s-control ansible_host=192.168.1.10 proxmox_vmid=300

[k3s_agents]
k3s-worker1 ansible_host=192.168.1.11 proxmox_vmid=301

# Nodes that actually hold Longhorn replicas. Control is excluded at the
# Longhorn level (allowScheduling: false, ADR 005), so the iSCSI shutdown
# ordering only matters here.
[longhorn_nodes]
k3s-worker1

[k3s_nodes:children]
k3s_servers
k3s_agents

[homelab:children]
proxmox_hosts
k3s_nodes

[homelab:vars]
ansible_user=root
ansible_ssh_private_key_file=~/.ssh/p1.pub
ansible_python_interpreter=/usr/bin/python3
